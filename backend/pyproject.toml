[project]
name = "uk-wind-forecast-backend"
version = "0.1.0"
description = "UK Wind Generation Day-Ahead Decision Support Backend"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
